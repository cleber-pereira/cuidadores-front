<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artigo | CuidaDF</title>
  <meta name="description" content="Artigos e conteúdos sobre cuidado de idosos e acompanhamento no Distrito Federal.">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" href="/img/favicon.png">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:title" content="Artigo | CuidaDF">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css?v3">
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-light bg-white sticky-top shadow-sm py-2">
    <div class="container">
      <a class="navbar-brand" href="index.html"><span>Cuida<em>DF</em></span></a>
      <a href="artigos.html" class="btn btn-sm btn-outline-brand">
        <i class="bi bi-journal-text me-1"></i>Todos os artigos
      </a>
    </div>
  </nav>

  <!-- LOADING -->
  <div id="artigo-carregando" class="text-center py-5">
    <div class="spinner-border text-success" role="status"></div>
    <div class="text-muted mt-3 small">Carregando artigo...</div>
  </div>

  <!-- NÃO ENCONTRADO -->
  <div id="artigo-nao-encontrado" class="d-none">
    <div class="d-flex align-items-center justify-content-center" style="min-height:70vh">
      <div class="container">
        <div class="mx-auto text-center p-4 p-md-5"
          style="max-width:480px;background:#fff;border-radius:1.25rem;box-shadow:0 10px 40px rgba(0,0,0,.08);border:1px solid #f1e9da">
          <div class="d-flex align-items-center justify-content-center mx-auto mb-4"
            style="width:84px;height:84px;border-radius:50%;background:#fff4e5">
            <i class="bi bi-journal-x" style="font-size:2.3rem;color:#e08a00"></i>
          </div>
          <h3 class="font-display mb-3">Artigo não encontrado</h3>
          <p class="text-muted mb-4">
            Este artigo pode ter sido removido ou o link utilizado não está mais disponível.
          </p>
          <a href="artigos.html" class="btn btn-brand w-100 py-2">
            <i class="bi bi-journal-text me-2"></i>Ver todos os artigos
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- ARTIGO -->
  <article id="artigo-detalhe" class="d-none">
    <div id="artigo-capa" class="artigo-capa"></div>

    <div class="container">
      <div class="artigo-conteudo-wrap mx-auto py-4 py-md-5">
        <button id="artigo-voltar" class="btn btn-sm btn-outline-brand mb-4" type="button">
          <i class="bi bi-arrow-left me-1"></i>Voltar
        </button>

        <span id="artigo-categoria" class="artigo-categoria-chip mb-3 d-inline-block"></span>
        <h1 id="artigo-titulo" class="font-display mb-3"></h1>

        <div class="d-flex flex-wrap gap-3 text-muted small mb-4 pb-4 border-bottom">
          <span id="artigo-autor"><i class="bi bi-person me-1"></i></span>
          <span id="artigo-data"><i class="bi bi-calendar3 me-1"></i></span>
          <span id="artigo-tempo-leitura"><i class="bi bi-clock me-1"></i></span>
        </div>

        <div id="artigo-conteudo" class="artigo-texto"></div>

        <div id="artigo-tags" class="mt-5"></div>

        <div class="text-center mt-5 pt-4 border-top">
          <button id="artigo-voltar-rodape" class="btn btn-outline-brand" type="button" onclick="document.getElementById('artigo-voltar').click()">
            <i class="bi bi-arrow-left me-1"></i>Voltar para a lista
          </button>
        </div>
      </div>
    </div>
  </article>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/artigos.js?v=1"></script>
</body>

</html>
